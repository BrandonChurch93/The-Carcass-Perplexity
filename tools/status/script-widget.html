<div id="ss" class="script-sheet inline" style="background:#151210;color:#e7e0d6;border-radius:10px;padding:18px 20px 6px;font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif"><p id="head" style="margin:0 0 12px;color:#a89e93;font-size:14.5px;line-height:1.45"></p><div id="tabs" role="tablist" aria-label="The parts of the script sheet" style="display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px"></div><div id="body" role="tabpanel"></div></div>
<script>
(function(){var v=window.visualization||{},s=(v.sources||{}).sheet||{},root=document.getElementById('ss');if(s.error||!s.data){root.textContent='The script sheet failed to load: '+(s.error||'no data');return;}var d=s.data,st=document.createElement('style');st.textContent=d.css+'\n#tabs button{font:600 13.5px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:8px 12px;border-radius:999px;border:1px solid #2f2925;background:transparent;color:#a89e93;cursor:pointer}\n#tabs button:hover{border-color:#80776e;color:#e7e0d6}\n#tabs button[aria-selected="true"]{background:#e8662c;border-color:#e8662c;color:#1a0f08}\n#tabs button:focus-visible{outline:2px solid #e8662c;outline-offset:2px}\n#body h3{margin:0 0 12px;font:400 26px/1.2 Georgia,serif}\n.script-sheet .script-clip{margin:0}\n.script-sheet .row:last-child,.script-sheet .unnamed li:last-child{border-bottom:0}';document.head.appendChild(st);var t=d.totals,head=document.getElementById('head');head.textContent='The draft against the cut list. '+t.lines+' lines, '+t.marked+' marked: '+t.byKind.length+' too long, '+t.byKind.tight+' tight, '+t.byKind.picture+' for the picture. Lengths are worked out from the text, not measured.';var items=d.clips.map(function(c){return{label:c.id+' · '+c.title+(c.marked?' · '+c.marked+' marked':''),html:c.html};});items.push({label:'Shown and not named',html:'<h3>Shown and not named</h3>'+d.unnamed});items.push({label:'The rules',html:'<h3>The rules of the note, checked on the draft</h3>'+d.rules});var tabs=document.getElementById('tabs'),body=document.getElementById('body');function show(i){body.innerHTML=items[i].html;Array.prototype.forEach.call(tabs.children,function(b,j){b.setAttribute('aria-selected',j===i?'true':'false');});}items.forEach(function(it,i){var b=document.createElement('button');b.type='button';b.setAttribute('role','tab');b.textContent=it.label;b.addEventListener('click',function(){show(i);});tabs.appendChild(b);});show(d.start||0);})();
</script>
