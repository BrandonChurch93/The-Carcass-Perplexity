<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{name}} · Review</title>
<style>
{{style}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <p class="eyebrow">Review</p>
    <h1>{{name}}</h1>
    <dl class="meta">
      <div><dt>Date</dt><dd>{{date}}</dd></div>
      <div><dt>Phase</dt><dd>{{phase}}</dd></div>
      <div><dt>Time</dt><dd>{{clock}}</dd></div>
    </dl>
  </div>
</header>
<nav class="parts" aria-label="Parts of this page">
  <div class="wrap">
{{nav}}
  </div>
</nav>
<main class="wrap">
{{parts}}
</main>
<footer class="wrap foot">
  <p>{{foot}}</p>
</footer>
</body>
</html>
