<div style="width:100%;font-family:var(--font-sans);color:var(--color-text-primary)"><div id="note" style="font-size:13px;line-height:1.45;color:var(--color-text-secondary);padding:2px 0 8px"></div><div id="g"></div></div>
<script>
(function(){var v=window.visualization||{},s=(v.sources||{}).pics||{},d=v.data||{},g=document.getElementById('g');document.getElementById('note').textContent=d.note||'';if(s.error||!s.data){g.textContent='Pictures failed to load: '+(s.error||'no data');return;}var cols=d.cols||1,span=d.span||[];g.style.cssText='display:grid;gap:8px;grid-template-columns:repeat('+cols+',1fr)';s.data.pics.forEach(function(p,i){var f=document.createElement('figure');f.style.cssText='margin:0;min-width:0;'+(span[i]?'grid-column:span '+span[i]:'');var im=document.createElement('img');im.src=p.src;im.alt=p.label;im.style.cssText='display:block;width:100%;height:auto;aspect-ratio:'+p.w+'/'+p.h+';border-radius:var(--border-radius-md);background:var(--color-background-secondary)';var c=document.createElement('figcaption');c.textContent=p.label;c.style.cssText='font-size:12px;line-height:1.4;color:var(--color-text-secondary);padding:4px 0 0';f.appendChild(im);f.appendChild(c);g.appendChild(f);});})();
</script>
